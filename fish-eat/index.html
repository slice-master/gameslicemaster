<body style="margin:0px;">
    <!-- PIXI -->
    <canvas id="stage" width="960" height="640" style="width: 100%; height: 100%; position:absolute;"></canvas>
    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
    <script>
        WebFont.load({
            google: {
                families: ['Noto Sans', 'Pacifico']
            },
            active: e => {
                init();
            },
            inactive: e => {
                init();
            }
        });
    </script>
    <!-- END PIXI -->
    <div id="titleMenu">
        <div style="display: flex;">
            <div class="left-col flex-column justify-content-end">
                <div class="left-col-bottom flex-column">

                </div>
            </div>
            <div class="middle-col">
                <img id="logo" src="./brand/stabfish-logo.svg" width="100%" />
                <input id="nameInput" type="text"></input>

                <div class="d-flex my-2">
                    <button id="playButton" class="btn btn-primary btn-100">Loading Asssets...0%</button>
                    <!-- <div class="btn btn-deep-teal d-flex align-items-center ml-2" onclick="triggerFullscreen()"><i
                            class="fas fa-expand"></i></div> -->
                    <!-- <div class="btn btn-yellow d-flex align-items-center ml-2" onclick="showSettings()"><i
                            class="fas fa-cog"></i></div> -->
                </div>
                <div style="display:none;">
                    <a id="showRecoverButton" style="color:orange; display:none;">❗️ Recover/Transfer Data</a>
                    <a id="loginOpen" style="color:orange; display:none;">⚓ Login</a>
                    <a id="logoutOpen" style="color:orange; display:none;">⚓ Logout</a>
                    <a style="margin-left: auto;" onclick="showFeedback()">✉️ Feedback</a>
                </div>
                <div class="d-flex my-2" style="display:none !important">
                    <a href="https://www.youtube.com/channel/UC2I5xnLIJ-neeuKcMTYQrzg/" target="_blank"
                        class="w-100 mr-1">
                        <button type="button" class="btn btn-youtube btn-lg w-100" data-toggle="tooltip"
                            data-placement="bottom" title="Youtube"><i class="fab fa-youtube pr-2"></i>
                            <!-- <span class="text-sm">Youtube</span> -->
                        </button>
                    </a>
                    <a href="https://discord.gg/Hg3kkGP" target="_blank" class="w-100 mx-1">
                        <button type="button" class="btn btn-discord btn-lg w-100" data-toggle="tooltip"
                            data-placement="bottom" title="Discord"><i class="fab fa-discord pr-2"></i>
                            <!-- <span class="text-sm">Discord</span> -->
                        </button>
                    </a>
                    <a href="https://www.reddit.com/r/stabfishio/" target="_blank" class="w-100 mx-1">
                        <button type="button" class="btn btn-reddit btn-lg w-100" data-toggle="tooltip"
                            data-placement="bottom" title="Reddit"><i class="fab fa-reddit pr-2"></i>
                            <!-- <span class="text-sm">Reddit</span> -->
                        </button>
                    </a>
                    <button type="button" class="btn btn-yellow ml-1" style="width: auto;" onclick="showSettings()"
                        data-toggle="tooltip" data-placement="bottom" title="Settings"><i
                            class="fa fa-cog"></i></button>
                </div>
                <div>
                    <div id="landingBanner">
                        <div id='stabfish-io_300x250'></div>
                    </div>
                </div>
            </div>
            <div class="right-col" style="display: none !important">
                <div id="highscoreContainer">
                    <div class="highscore-item">
                        <div class="rank"></div>
                        <div class="name"></div>
                        <div class="kills-header">Kills</div>
                        <div class="score-header">Score</div>
                    </div>
                    <div id="connectingToServer">
                        Connecting To Server...
                    </div>
                    <div id="highscores">
                    </div>
                    <hr />
                    <div style="display: flex; justify-content: center;">
                        <button id="todayButton" class="btn btn-highscore btn-sm active">Today</button>
                        <button id="allButton" class="btn btn-highscore btn-sm mx-2">All</button>
                        <button id="krakenRunButton" class="btn btn-highscore btn-sm ">Kraken&nbsp;Run</button>
                        <button id="topScoresButton" class="btn btn-highscore btn-sm active"
                            style="display:none;">Score</button>
                        <button id="topKillsButton" class="btn btn-highscore btn-sm ml-1"
                            style="display:none;">Kills</button>
                        <button id="topCombosButton" class="btn btn-highscore btn-sm ml-1"
                            style="display:none;">Combos</button>
                        <button id="topSurvivalsButton" class="btn btn-highscore btn-sm ml-1"
                            style="display:none;">Survive</button>
                    </div>
                    <template id="sampleHighscoreItem">
                        <div class="highscore-item">
                            <div class="rank">1.</div>
                            <div class="name ellipsis">dragonwhites</div>
                            <div class="kills">10</div>
                            <div class="score">1000</div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
    <div id="settingsContainer" class="centerer" style="display: none;">
        <div id="settings" class="sf-modal">
            <h2>⚙️ Settings</h2>
            <form id="settingsForm" class="pt-2">

                <label for="control" class="font-weight-bold">Control</label>
                <div class="mb-2">
                    <div class="custom-control custom-radio custom-control-inline">
                        <input type="radio" id="settingsControlMouse" name="settingsControl"
                            class="custom-control-input" value="mouse">
                        <label class="custom-control-label" for="settingsControlMouse">Mouse</label>
                    </div>
                    <div class="custom-control custom-radio custom-control-inline">
                        <input type="radio" id="settingsControlTouch" name="settingsControl"
                            class="custom-control-input" value="touch">
                        <label class="custom-control-label" for="settingsControlTouch">Touch Screen</label>
                    </div>
                </div>

                <div class="d-flex justify-content-between my-3">
                    <label for="fpsSwitch" class="font-weight-bold">Framerate</label>
                    <div class="d-flex">
                        <label class="pr-2" for="fpsSwitch">30 FPS</label>
                        <div class="custom-control custom-switch">
                            <input type="checkbox" class="custom-control-input" id="fpsSwitch">
                            <label class="custom-control-label" for="fpsSwitch">60 FPS</label>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="d-flex justify-content-between">
                        <label for="dpiRange" class="font-weight-bold">Resolution</label>
                        <div id="dpiRangeText">1.0</div>
                    </div>
                    <input type="range" class="custom-range" id="dpiRange" name="dpi" min=0.5 max=2 step=0.1>
                </div>
                <div>
                    <label for="detailsRange" class="font-weight-bold">Details</label>
                    <div class="d-flex justify-content-between">
                        <div class="text-sm">minimum</div>
                        <div class="text-sm">maximum</div>
                    </div>
                    <input type="range" class="custom-range" id="detailsRange" name="details" min=0 max=10 step=10>
                </div>
                <div class="mt-2">
                    <div class="d-flex justify-content-between">
                        <label for="detailsRange" class="font-weight-bold">Team Colors</label>
                        <div class="btn btn-primary btn-sm" id="defaultTeamColorButton">default</div>
                    </div>
                    <div class="row">
                        <div class="col-3">green<input id="teamColorGreen" value='#39E700' /></div>
                        <div class="col-3">red<input id="teamColorRed" value='#FF0033' /></div>
                        <div class="col-3">yellow<input id="teamColorYellow" value='#FFCC00' /></div>
                        <div class="col-3">purple<input id="teamColorPurple" value='#6633CC' /></div>
                    </div>
                </div>
            </form>
            <div id="webGlWarning" class="text-warning">WebGL is disabled! Enable it for better performance!</div>
            <button id="closeSettingsButton" class="btn btn-primary" onclick="hideSettings()">Close</button>
        </div>
    </div>
    <div id="gameoverAd">
        <div id="youtubeBar"></div>
        <div id="gameOverBanner">
            <div id="stabfish-io_320x50"></div>
            <div id="stabfish-io_468x60"></div>
            <div id="stabfish-io_320x100"></div>
            <div id="stabfish-io_336x280"></div>
            <div id="stabfish-io_728x90"></div>
            <div id="stabfish-io_970x250"></div>
        </div>
    </div>
    <div class="metrics">
        <div>players: <span id="numPlayers">0</span> | bots: <span id="numBots">0</span></div>
        <div id="ping">ping: 100ms</div>
        <div id="renderDelay">render delay: 100ms</div>
        <a id="spectateButton" style="color:orange; display:none;">spectate</a>
    </div>
    <div id="footer">
       
    </div>
    <div id="overlay" style="display: none;"></div>
    <div id="xmas2020BannerContainer" class="centerer" style="display: none;">
        <img id="xmas2020Banner" src="./images/xmas2023-banner.png" style="max-width: 80%;" />
    </div>
    


    <div id="announcement" class="scroll-left">
    </div>
    <!-- HIDE FOR CRAZYGAMES -->
    <div id="preroll"></div>

</body>

</html>
